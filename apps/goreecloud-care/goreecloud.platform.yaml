  wardveil_security:
    result: applicable-nonconformant
    version: null
    evidence:
      - apps/goreecloud-care/SECURITY.md
      - apps/goreecloud-care/WARDVEIL-INTEGRATION.md
      - apps/goreecloud-care/goreecloud_care/platform_status.py
      - apps/goreecloud-care/packaging/goreecloud-care-helper
      - apps/goreecloud-care/packaging/com.goreecloud.care.policy
    notes: Stable 0.1.0 has historical scoped Wardveil acceptance. The 0.2.0-dev3 package must independently prove and obtain governance for the local-maintenance-privilege-boundary before any protection permission transfers.
  everkeep:
    result: applicable-nonconformant
    version: null
    evidence:
      - apps/goreecloud-care/RECOVERY.md
      - apps/goreecloud-care/contracts/everkeep.adoption.json
      - apps/goreecloud-care/contracts/everkeep.acceptance.json
      - apps/goreecloud-care/goreecloud_care/platform_status.py
      - apps/goreecloud-care/scripts/validate-package-lifecycle.sh
      - apps/goreecloud-care/scripts/run-representative-acceptance.sh
    notes: Historical 0.1.0 continuity readiness is exact-build scoped. Dev3 requires new package lifecycle, representative-target, exact package SHA-256, and separate Everkeep promotion evidence.
  glaze_ui:
    result: applicable-migration-required
    version: "1.4.1"
    evidence:
      - apps/goreecloud-care/GLAZE-UI-CONFORMANCE.md
      - apps/goreecloud-care/GLAZE-UI-V1.4-MIGRATION.md
      - apps/goreecloud-care/GLAZE-UI-V1.5-MIGRATION.md
      - apps/goreecloud-care/goreecloud_care/glaze_v14.py
      - apps/goreecloud-care/goreecloud_care/glaze_v14_optical.py
      - apps/goreecloud-care/goreecloud_care/glaze_v15.py
      - apps/goreecloud-care/tests/test_glaze_v14_contract.py
      - apps/goreecloud-care/tests/test_glaze_v15_contract.py
      - https://github.com/GoreeCloud/goreecloud-glaze-ui/commit/b7fa8164bfdeaa1dc0acb21b770e7601120da04e
    notes: Current required Stable target is Glaze UI 1.5.0. Care still runs the inherited V1.4.1 optical GTK implementation and now has a bounded V1.5 context/capability presentation resolver in source, but that resolver is not yet wired across the active GTK surfaces and no fresh application-specific V1.5 consumer acceptance exists. Migration therefore remains required.
  mesh:
    result: not-applicable-justified
    version: null
    evidence:
      - apps/goreecloud-care/API.md
      - apps/goreecloud-care/CAPABILITIES.md
    notes: Current Care has no cross-application coordination, service discovery, Mesh event transport, or Mesh policy authority.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: not-applicable-justified
    version: null
    evidence:
      - apps/goreecloud-care/SPECIFICATIONS.md
      - apps/goreecloud-care/API.md
    notes: Current Care has no GoreeCloud account, remote management, multi-user behavior, or delegated administration.

health:
  health_endpoint: local-cli://goreecloud-care/health
  readiness_endpoint: local-cli://goreecloud-care/health

continuity:
  backup:
    required: false
    requirements:
      - Care persists no substantial durable user application data requiring an application-owned backup workflow; continuity is exact package/source recovery evidence.
  restore:
    required: true
    requirements:
      - The exact 0.2.0-dev3 / 0.2.0~dev3 candidate must pass install, remove/reinstall, downgrade, restore, final installed validation, provenance, and representative-target handoff before release promotion.
      - Historical Stable 0.1.0 recovery evidence remains audit and rollback context and does not accept the new candidate.
      - Permanent Trash deletion is irreversible maintenance behavior and is not represented as recoverable application data.
  export:
    required: false
    requirements:
      - Care has no durable user application dataset requiring application-data export/import; read-only reports and status remain available.
  portability:
    required: true
    requirements:
      - Report and local API schemas and versioning remain explicit and machine-readable.
      - Package policy, recovery, migration, rollback, and exact provenance remain documented without proprietary durable data formats.

external_dependencies:
  - name: python3
    purpose: Native application runtime, reports, local platform status, and Maintenance Insights.
    required: true
    version_constraint: ">=3.10"
  - name: PyGObject GTK 3
    purpose: Native Zorin OS desktop interface and Maintenance Insights.
    required: true
    version_constraint: null
  - name: ATK introspection
    purpose: Assistive-technology roles, names, descriptions, and status semantics.
    required: true
    version_constraint: null
  - name: PolicyKit
    purpose: Explicit authorization for APT cleanup and Linux file-cache reclaim.
    required: true
    version_constraint: null

compatibility:
  platform_contract: "0.2"
  glaze_ui_required: "1.5.0"
  requires:
    - goreecloud-platform-contract==0.2
    - glaze-ui==1.5.0
  provides:
    - goreecloud-care-local-maintenance
    - goreecloud-care-read-only-maintenance-report
    - goreecloud-care-read-only-maintenance-insights
    - goreecloud-care-local-status-api-v1

