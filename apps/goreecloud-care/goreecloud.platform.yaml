conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - apps/goreecloud-care/GLAZE-UI-CONFORMANCE.md
    - apps/goreecloud-care/GLAZE-UI-V1.4-MIGRATION.md
    - apps/goreecloud-care/GLAZE-UI-V1.5-MIGRATION.md
    - apps/goreecloud-care/goreecloud_care/glaze_v14.py
    - apps/goreecloud-care/goreecloud_care/glaze_v14_optical.py
    - apps/goreecloud-care/goreecloud_care/glaze_v15.py
  blockers:
    - Exact 0.2.0-dev3 automated qualification must pass for the current source/package identity.
    - Glaze UI 1.5.0 repository-local migration is incomplete; the bounded V1.5 resolver is not yet wired across the active GTK surfaces and application-specific acceptance is absent.
    - Representative rendered/native Zorin OS 17.3 V1.5 acceptance remains required.
    - Privacy Shield must independently accept the exact dev3 identity before production privacy status can be claimed.
    - Wardveil must independently govern exact dev3 privilege-boundary evidence before protection permission can transfer.
    - Everkeep must independently accept exact dev3 restore/rollback evidence before continuity can become ready.
    - Stable promotion requires a later explicit exact-candidate decision and cannot be inferred from historical 0.1.0, dev1, dev2, V1.4.0, or V1.4.1 evidence.

