name: GoreeCloud Glaze V1.7 Theme Validation

on:
  pull_request:
    paths:
      - 'themes/glaze-v1.7/**'
      - '.github/workflows/glaze-theme-ci.yml'
      - 'CHANGELOGS.md'
      - 'IMPLEMENTED-FEATURES.md'
      - 'PLANNED-FEATURES.md'
  push:
    branches:
      - 'feat/glaze-v1-7-zorin-theme'
    paths:
      - 'themes/glaze-v1.7/**'
      - '.github/workflows/glaze-theme-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-theme-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out revision
        run: |
          set -eu
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          printf 'Expected: %s\nActual:   %s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Validate GoreeCloud Glaze theme
        run: bash themes/glaze-v1.7/scripts/validate.sh

      - name: Install GTK CSS parser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-gtk-4.0

      - name: Parse GTK 3 theme sources
        run: |
          set -eu
          for css in             themes/glaze-v1.7/variants/GoreeCloud-Glaze/gtk-3.0/gtk.css             themes/glaze-v1.7/variants/GoreeCloud-Glaze-Dark/gtk-3.0/gtk.css
          do
            /usr/bin/python3 - "$css" <<'PY'
import gi
import sys
gi.require_version("Gtk", "3.0")
from gi.repository import Gtk
provider = Gtk.CssProvider()
provider.load_from_path(sys.argv[1])
print("GTK 3 parsed:", sys.argv[1])
PY
          done

      - name: Parse GTK 4 theme sources
        run: |
          set -eu
          for css in             themes/glaze-v1.7/variants/GoreeCloud-Glaze/gtk-4.0/gtk.css             themes/glaze-v1.7/variants/GoreeCloud-Glaze-Dark/gtk-4.0/gtk.css
          do
            /usr/bin/python3 - "$css" <<'PY'
import gi
import sys
gi.require_version("Gtk", "4.0")
from gi.repository import Gtk
provider = Gtk.CssProvider()
provider.load_from_path(sys.argv[1])
print("GTK 4 parsed:", sys.argv[1])
PY
          done
